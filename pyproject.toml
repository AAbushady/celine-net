[tool.ruff.lint]
select = ["F", "E9", "E101", "E401", "E711", "E712", "E713", "E714", "E721", "E722",
          "W291", "W292", "W293", "W605"]

[tool.ruff.lint.per-file-ignores]
# a test names an imported fixture as its argument
"tests/**" = ["F811"]
