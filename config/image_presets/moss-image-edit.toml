# MOSS-Image edit on ComfyUI's own MOSS-Image support, after its "MOSS-Image: Image Edit"
# template: the edit LoRA (moss_image_edit_lora_rank_64_bf16, the bytes of
# chinoll/Moss-Image-Edit) on the SFT model in int8, the Qwen3.5 9B text encoder in W4A8,
# the small FLUX.2 VAE. TextEncodeMOSSImageEdit in the LoRA's own layout (Moss-Image-Edit)
# encodes the instruction and the negative prompt with 1 to 4 reference images, each
# scaled to 1 megapixel in steps of 16 first. The LoRA author's settings: 30 steps, cfg 4,
# euler, normal, negative-branch layer skip at 22. Width and height set the output; by
# default the app gives the first image's shape at 1024x1024's pixel count. A reference
# that is not given loses its LoadImage node, its scaling and the inputs they fed.
label = "MOSS-Image edit"
family = "MOSS-Image"
task = "edit"
workflow = "moss-image-edit.json"
good_at = "Edits from up to four images: colours, outfits, objects, light, season, style. It can put a person from one image into the outfit or place of another."
prompting = """
One instruction in plain English (Chinese works too): say the change, then what stays.
The phrasing the LoRA was trained on works best: "Change only the X to Y. Keep the
character, face, hair, pose, background and composition unchanged." "Change the
background to a sunny beach, preserving the person." "Make it winter, snow on the roofs,
keep the composition."

- With several images, name each by its number in the order given: `source` is image 1,
  `source2` image 2, up to `source4` image 4. Say the role of each: "Dress the person in
  image 1 in the outfit from image 2. Preserve the person's identity and pose." "Put the
  woman from image 1 and the man from image 2 side by side on the bench in image 3."
- One change per instruction; for a second change edit the result again.
- Name what stays by role ("preserving the person", "keep her face and hair"); do not
  describe it again.
- Width and height set the output, in steps of 16. Empty: the first image's shape at
  about 1 megapixel.
- A negative prompt works (cfg 4). It is read with the images and names what to avoid:
  "blurry, distorted face, extra fingers".
"""
example = "Dress the person in image 1 in the outfit from image 2. Preserve the person's identity and pose."
size = { step = 16, max_pixels = 2100000 }

[parameters.prompt]
inputs = [["6", "prompt"]]

[parameters.negative]
inputs = [["7", "prompt"]]

[parameters.image]
inputs = [["2", "image"]]

[parameters.image2]
inputs = [["3", "image"]]

[parameters.image3]
inputs = [["4", "image"]]

[parameters.image4]
inputs = [["5", "image"]]

[parameters.seed]
inputs = [["8", "seed"]]

[parameters.width]
inputs = [["9", "width"]]

[parameters.height]
inputs = [["9", "height"]]
