# MOSS-Image SFT, text to image, on ComfyUI's own MOSS-Image support, after its "Text to
# Image (MOSS-Image)" template with its prompt upsampler off: the SFT model in int8
# (moss_image_sft_int8_convrot), the Qwen3.5 9B text encoder in W4A8
# (qwen3.5_9b_w4a8_gptq), the small FLUX.2 VAE. OpenMOSS's settings, which the template
# names for results closer to theirs: 50 steps, cfg 3, euler, the model's own shift of 5,
# negative-branch layer skip at 22; scheduler sgm_uniform.
label = "MOSS-Image"
family = "MOSS-Image"
task = "generate"
workflow = "moss-image.json"
good_at = "Pictures with readable text in them (signs, posters, notes, Chinese too) and layouts where things must sit in a given place. About 16 s an image at 1024x1024; the first of a batch also loads the models, about 35 s more."
prompting = """
English works best; Chinese works. Three ways to write, mixable:

- A plain description, a few sentences: subject and action, place, light.
- A tag list in this order: quality, score, meta, year, character, series, artist,
  general ("best quality, highres, 1girl, silver hair, running through rain").
- A JSON layout for exact placement: {"summary": {"meta": ["poster"], "canvas":
  "single", "caption": "the whole picture and its style"}, "items": [{"label": "text",
  "caption": "large dark-blue title at the top", "text": "TITLE", "bbox": [y1, x1, y2,
  x2]}, {"label": "object", "caption": "...", "bbox": [...]}], "bbox_coord_space":
  "abs_centralized", "bbox_format": "yxyx"}. An item's label is text, object or
  character; a text item has its words in text. Coordinates are pixels from the canvas
  center, y down and x right, so a 1024x1024 picture runs from -512 to 512; use the same
  width and height you ask for.

Text to render goes in double quotes, line breaks and all. A negative prompt that helps:
"worst quality, bad anatomy, watermark, jpeg artifact". Best at 1 to 2 megapixels.
"""
example = "A candid photo of a young woman laughing at a street food stall at night, steam rising from the grill, warm string lights, a hand-painted sign above the stall reads \"NOODLES 5$\""
size = { step = 16, max_pixels = 2100000 }

[parameters.prompt]
inputs = [["4", "text"]]

[parameters.negative]
inputs = [["5", "text"]]

[parameters.seed]
inputs = [["8", "seed"]]

[parameters.width]
inputs = [["6", "width"]]

[parameters.height]
inputs = [["6", "height"]]
