# LTX-2.3 22B dev in GGUF Q5_K_M (unsloth), run as unsloth's own LTX-2.3 workflow runs it, so the model sits on
# a 24 GB card instead of streaming from system RAM: the dev model for 20 steps at half size with CFG 4 and the
# negative prompt (node 8), then the x2 latent upscaler and 3 steps at full size with the distilled LoRA at 1.0
# and CFG 1. The model loads through ComfyUI-GGUF (UnetLoaderGGUF, node 1); the text encoder is Gemma 3 12B
# with the model's embeddings connectors (DualCLIPLoader, type ltxv, node 3); the video and audio VAEs are
# their own files (nodes 5, 4). The clip's sound is made with its picture (nodes 19, 37). Without a start
# picture `no_image` switches node 14 to the blank image of node 13 and bypasses both picture nodes (18, 29);
# with one, node 12 holds it. The prompt goes in as written. Width and height are halved for the first pass
# (nodes 10, 11), so their step is 64. The clip is saved as MP4 with its sound (node 39), and four of its
# frames (the first, the 40th, the 80th and the last) as stills (node 47), the pictures its look shows.
label = "LTX 2.3 22B"
family = "LTX"
workflow = "ltx2.3-22b.json"
good_at = "Clips with their own sound, from a prompt or a picture of yours: speech, footsteps, rain, music in the scene, timed to what moves."
prompting = """
Write the prompt as one paragraph of plain sentences that tell what happens in order, like a
shot in a script:
1. The subject and what it looks like: "a woman in a grey wool coat with short dark hair"
2. What happens, in the order it happens: "she walks to the window, stops, and turns to the camera"
3. The place and the light: "a small apartment at night, warm lamp light, rain on the glass"
4. The camera and the focus: "the camera pushes in slowly and holds, deep focus, the room behind her stays sharp"
5. What is heard and when: "rain taps on the window, the floorboards creak under her steps"
6. Speech in quotes, with who says it: She says: "It's still raining."

Name every sound the clip should have: the model makes the sound from the prompt, and a
sound the prompt leaves out is the model's guess. Say how deep the focus is when the
background matters: a push-in or a close-up blurs what is behind the subject unless the
prompt asks for deep focus. One clear motion and one camera move read better than several.
From a picture (`source`), say what changes and what is heard: the picture already sets the
subject, the place and the light.
"""
example = "A woman in a grey wool coat with short dark hair walks to the window of a small apartment at night, stops, and turns to the camera. Warm lamp light, rain running down the glass. The camera pushes in slowly and holds on her face, deep focus, the room behind her stays sharp. Rain taps on the window and the floorboards creak under her steps. She says quietly: \"It's still raining.\""

[size]
step = 64
max_pixels = 1000000

[frames]
step = 8

[parameters.prompt]
inputs = [["7", "text"]]

[parameters.negative]
inputs = [["8", "text"]]

[parameters.seed]
inputs = [["21", "noise_seed"]]

[parameters.width]
inputs = [["10", "values.a"], ["13", "width"], ["15", "resize_type.width"]]

[parameters.height]
inputs = [["11", "values.a"], ["13", "height"], ["15", "resize_type.height"]]

[parameters.length]
inputs = [["17", "length"], ["19", "frames_number"]]

[parameters.fps]
inputs = [["9", "frame_rate"], ["19", "frame_rate"], ["38", "fps"]]

[parameters.image]
inputs = [["12", "image"]]

[parameters.no_image]
inputs = [["14", "switch"], ["18", "bypass"], ["29", "bypass"]]
